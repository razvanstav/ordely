services:
  app:
    build: .
    working_dir: /app
    volumes:
      - .:/app
    environment:
      APP_ENV: dev
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: ordely
      DB_TEST_NAME: ordely_test
      DB_USER: ordely
      DB_PASSWORD: ${DB_PASSWORD:?Copy .env.example to .env first}
    ports:
      - "127.0.0.1:${APP_PORT:-8080}:8080"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@file_get_contents('http://127.0.0.1:8080/health') === false ? 1 : 0);"]
      interval: 5s
      timeout: 5s
      retries: 12

  db:
    image: mysql:8.4.11
    environment:
      MYSQL_DATABASE: ordely
      MYSQL_USER: ordely
      MYSQL_PASSWORD: ${DB_PASSWORD:?Copy .env.example to .env first}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set the local MySQL root password}
    ports:
      - "127.0.0.1:${DB_PORT:-33060}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./docker/mysql/01-test-database.sql:/docker-entrypoint-initdb.d/01-test-database.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=\"$$MYSQL_ROOT_PASSWORD\" mysql --protocol=TCP -h127.0.0.1 -uroot -e 'SELECT 1' >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

volumes:
  mysql-data:
